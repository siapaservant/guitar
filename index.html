<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14120e">
<meta name="description" content="黑金 Les Paul Custom 烏木指板：12 調級數、音階、CAGED、和弦、順階和弦與指板練習。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="黑金指板">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>黑金指板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500;1,6..96,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-row lacquer top bar → focused control panel → full-length neck → fixed bottom tab bar; choices open in slide-up sheets */
:root{
  color-scheme:dark;
  --ink:#090806;--lacquer:#131109;--raise:#1c1912;--raise2:#242017;--line:#2e291f;--hair:rgba(212,175,55,.22);
  --gold:#d4af37;--gold-hi:#f3d98c;--gold-lo:#8a6d1f;
  --text:#f2ebda;--muted:#a39a84;--faint:#6f6754;--cream:#eadfc2;
  --ok:#5cc98a;--bad:#e2574c;
  --d1:#e8bf4a;--d2:#ef8f5e;--d3:#ec6b86;--d4:#b18aea;--d5:#5aaef0;--d6:#46c9ac;--d7:#a6d264;
  --f-display:"Bodoni Moda","Noto Serif TC",Georgia,serif;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --nav-h:62px;
}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--lacquer)}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* ---------- intro ---------- */
.intro{position:fixed;inset:0;z-index:100;background:radial-gradient(80% 60% at 50% 45%,#1d1810 0%,#0b0907 60%,#050403 100%);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.intro .stage{position:relative;height:min(86vh,86dvh,900px);aspect-ratio:2/5;max-width:44vw;transform-origin:50% 24%;will-change:transform}
.intro svg{width:100%;height:100%;display:block;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.intro .copy{position:absolute;left:0;right:0;bottom:calc(5vh + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;transition:opacity .25s}
.intro .t1{font-family:var(--f-display);font-style:italic;font-size:30px;color:var(--gold-hi);letter-spacing:.02em;line-height:1}
.intro .t2{font-size:12px;letter-spacing:.42em;color:var(--gold);margin-top:8px;padding-left:.42em}
.intro .t3{margin-top:18px;font-size:13px;color:var(--muted);letter-spacing:.2em;animation:breathe 1.8s ease-in-out infinite}
.intro .side{transition:opacity .2s;position:absolute;top:calc(6vh + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:11px;letter-spacing:.5em;color:var(--faint);padding-left:.5em}
@keyframes breathe{50%{opacity:.35}}
@media (min-width:760px){.intro .stage{max-width:none}}

/* ---------- top bar ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(19,17,9,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.bar{display:flex;align-items:center;gap:10px;padding-block:9px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand .l1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:21px;color:var(--gold-hi);line-height:1;white-space:nowrap}
.brand .l2{font-size:11px;font-weight:700;letter-spacing:.28em;color:var(--gold);white-space:nowrap}
.keybtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--raise);border:1px solid var(--line)}
.keybtn .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;color:#1a1306;background:radial-gradient(circle at 40% 30%,#fff1bf,var(--gold) 60%,#a47b1c)}
.keybtn .kl{font-size:13px;color:var(--text);white-space:nowrap}
.keybtn svg,.iconbtn svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.iconbtn{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line)}
.iconbtn svg{width:19px;height:19px;stroke:var(--gold-hi)}

/* ---------- panel ---------- */
main .wrap{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--gold);font-weight:700}
.title{all:unset;display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.15;color:var(--gold-hi);text-wrap:balance}
button.title{cursor:pointer}
button.title svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2.4;flex:0 0 auto}
.title small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:.04em}
.lead{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.lead b{color:var(--text);font-weight:700}
.headrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.headrow .grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.play{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 4px 14px rgba(212,175,55,.25);flex:0 0 auto}
.play svg{width:18px;height:18px;fill:#1a1306}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--lacquer);gap:2px;max-width:100%}
.seg button{all:unset;cursor:pointer;padding:6px 13px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise2);color:var(--gold-hi);font-weight:700;box-shadow:inset 0 0 0 1px var(--gold-lo)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:2px}
.scroller::-webkit-scrollbar{display:none}
.pill{all:unset;cursor:pointer;flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:14px;white-space:nowrap}
.pill small{color:var(--muted);font-size:11px;margin-left:5px}
.pill[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi);background:#2a2211;font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:40px}
.dot .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#140f05;font-weight:900;font-size:14px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);transition:opacity .2s,transform .2s}
.dot .nm{font-size:12px;color:var(--muted)}
.dot[aria-pressed="false"] .n{opacity:.22;transform:scale(.86)}
div.dot{cursor:default}
.shapes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shape{all:unset;cursor:pointer;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:21px;color:var(--c);border:2px solid color-mix(in srgb,var(--c) 45%,transparent);background:var(--lacquer)}
.shape[aria-pressed="true"]{background:var(--c);color:#140f05;border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.shape.all{font-family:var(--f-body);font-size:13px;font-weight:700;width:auto;padding:0 14px;border-radius:999px;--c:var(--gold-hi)}
.stepper{display:flex;align-items:center;gap:6px;background:var(--lacquer);border:1px solid var(--line);border-radius:14px;padding:6px}
.stepper button{all:unset;cursor:pointer;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--raise)}
.stepper button svg{width:18px;height:18px;stroke:var(--gold-hi);fill:none;stroke-width:2.4}
.stepper .mid{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column}
.stepper .mid b{font-size:15px}
.stepper .mid span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dc{all:unset;cursor:pointer;text-align:center;padding:9px 0 8px;border-radius:12px;background:var(--lacquer);border:1px solid var(--line);display:flex;flex-direction:column;gap:1px;min-width:0}
.dc .rn{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--gold-hi);white-space:nowrap}
.dc .cn{font-size:12px;font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.dc .fn{font-size:9.5px;color:var(--faint);letter-spacing:.08em}
.dc[aria-pressed="true"]{border-color:var(--gold);background:#2a2211}
.dc.playing{border-color:var(--gold-hi);box-shadow:0 0 0 2px var(--gold-hi)}
.card{background:linear-gradient(180deg,var(--lacquer),#100e09);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:700}
.seq{display:flex;flex-wrap:wrap;gap:6px}
.seq span{padding:4px 10px;border-radius:8px;background:var(--raise);font-weight:700;font-size:13px;transition:background .15s}
.seq span.on{background:var(--gold);color:#1a1306}
.tempo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tempo button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--raise);color:var(--gold-hi);font-weight:700}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-variant-numeric:tabular-nums}
.stat div{background:var(--lacquer);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:24px;color:var(--gold-hi);line-height:1.1}
.stat span{font-size:10px;color:var(--muted);letter-spacing:.12em}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px}
.answers button{all:unset;cursor:pointer;text-align:center;font-weight:900;font-size:17px;padding:12px 0;border-radius:12px;background:var(--raise);border:1px solid var(--line)}
.answers .ok{background:var(--ok);color:#06140c;border-color:var(--ok)}
.answers .bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.msg{font-weight:700;color:var(--gold-hi);margin:0}
.ghostbtn{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;border:1px solid var(--gold-lo);color:var(--gold-hi);font-size:14px;font-weight:700}
.goldbtn{all:unset;cursor:pointer;padding:8px 18px;border-radius:999px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1a1306;font-size:14px;font-weight:700}
.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.learn .card p,.learn .card li{color:var(--muted);font-size:14px;margin:0}
.learn .card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.learn .card b{color:var(--text)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--gold);font-weight:700;font-size:12px}
.src a{color:var(--gold-hi)}
.hint{font-size:12px;color:var(--faint);margin:0}

/* ---------- neck ---------- */
.neck{position:relative;min-width:0;border-radius:18px;background:radial-gradient(120% 50% at 50% 0%,#1b170f,var(--ink));padding-block:8px;border:1px solid rgba(212,175,55,.08)}
#neckSvg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#neckSvg text{font-family:var(--f-body);pointer-events:none}
.m{transform-box:fill-box;transform-origin:center;animation:pop .28s cubic-bezier(.2,1.4,.4,1) both}
.noanim .m{animation:none}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
.flash{animation:fl 1.6s ease-out forwards}
@keyframes fl{0%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* ---------- bottom nav ---------- */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,13,9,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
.nb{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--faint);position:relative}
.nb svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-selected="true"]{color:var(--gold-hi)}
.nb[aria-selected="true"]::before{content:"";position:absolute;top:0;width:26px;height:2px;border-radius:2px;background:var(--gold)}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .22s}
.sheet .body{position:absolute;left:0;right:0;bottom:0;max-height:84vh;overflow-y:auto;background:linear-gradient(180deg,#19160f,#0f0d09);border-top:1px solid var(--hair);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}
.sheet.open .bd{opacity:1}.sheet.open .body{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h4{margin:4px 0 12px;font-family:var(--f-display);font-size:22px;color:var(--gold-hi);font-weight:700}
.sheet h5{margin:16px 0 8px;font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:700}
.list{display:flex;flex-direction:column;gap:6px}
.li{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:var(--raise);border:1px solid transparent}
.li[aria-pressed="true"]{border-color:var(--gold);background:#2a2211}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.li .tx b{font-size:15px}
.li .tx span{font-size:12px;color:var(--muted)}
.li .ck{width:18px;height:18px;stroke:var(--gold-hi);fill:none;stroke-width:2.6;visibility:hidden}
.li[aria-pressed="true"] .ck{visibility:visible}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.cgrid button{all:unset;cursor:pointer;padding:10px 6px;border-radius:12px;background:var(--raise);border:1px solid transparent;text-align:center;display:flex;flex-direction:column}
.cgrid button b{font-size:15px}
.cgrid button span{font-size:11px;color:var(--muted)}
.cgrid button[aria-pressed="true"]{border-color:var(--gold);background:#2a2211;color:var(--gold-hi)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.set .tx{display:flex;flex-direction:column}
.set .tx span{font-size:12px;color:var(--muted)}
.sw{position:relative;width:48px;height:28px;flex:0 0 auto}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#d9d2c0;transition:transform .2s}
.sw input:checked+i{background:var(--gold)}
.sw input:checked+i::after{transform:translateX(20px);background:#fff8e2}
.sw input:focus-visible+i{outline:2px solid var(--gold-hi);outline-offset:2px}
.cof{width:100%;max-width:330px;display:block;margin:0 auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px));z-index:25;background:rgba(24,21,14,.97);border:1px solid var(--gold-lo);color:var(--text);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center;width:max-content}
.toast b{color:var(--gold-hi)}
@media (prefers-reduced-motion:reduce){.m,.pulse,.flash,.intro .t3{animation:none}.sheet .body,.sheet .bd{transition:none}}
</style>
</head>
<body>

<div class="intro" id="intro" role="button" tabindex="0" aria-label="輕觸進入">
  <div class="side">LES PAUL CUSTOM · EBONY</div>
  <div class="stage" id="stage"><svg id="guitar" viewBox="0 0 400 1000" aria-hidden="true"></svg></div>
  <div class="copy" id="introCopy"><div class="t1">Ebony Custom</div><div class="t2">黑金指板・吉他樂理</div><div class="t3">輕觸琴頸開始</div></div>
</div>

<header class="top"><div class="wrap bar">
  <div class="brand"><span class="l1">Ebony</span><span class="l2">黑金指板</span></div>
  <button class="keybtn" data-act="sheet" data-v="key" aria-label="選擇調性"><span class="k" id="keyK">C</span><span class="kl" id="keyL">C 大調</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <button class="iconbtn" data-act="sheet" data-v="display" aria-label="顯示設定"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div></header>

<main><div class="wrap">
  <section class="panel" id="panel"></section>
  <div class="neck" id="neck"><svg id="neckSvg" xmlns="http://www.w3.org/2000/svg"><g id="stat"></g><g id="dyn"></g></svg></div>
  <section class="panel" id="panel2"></section>
</div></main>

<nav class="bottom" aria-label="主選單"><div class="in" role="tablist">
  <button class="nb" role="tab" data-act="tab" data-v="scale"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="10" cy="13" r="2"/><circle cx="15" cy="9" r="2"/><circle cx="20" cy="5" r="2"/></svg>音階</button>
  <button class="nb" role="tab" data-act="tab" data-v="caged"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>CAGED</button>
  <button class="nb" role="tab" data-act="tab" data-v="chord"><svg viewBox="0 0 24 24"><path d="M5 3v18M10 3v18M15 3v18M20 3v18M5 7h15M5 12h15"/><circle cx="10" cy="9.5" r="1.6" fill="currentColor"/><circle cx="15" cy="14.5" r="1.6" fill="currentColor"/></svg>和弦</button>

  <button class="nb" role="tab" data-act="tab" data-v="quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>練習</button>

 '9|m7':[null,0,2,0,1,0],'4|m7':[0,2,0,0,0,0],'2|m7':[null,null,0,2,1,1],

const CAGED={C:{fr:[0,3,2,0,1,0],win:[0,3],roots:'第 5、2 弦'},A:{fr:[null,3,5,5,5,3],win:[2,5],roots:'第 5、3 弦'},G:{fr:[8,7,5,5,5,8],win:[4,8],roots:'第 6、3、1 弦'},E:{fr:[8,10,10,9,8,8],win:[7,10],roots:'第 6、4、1 弦'},D:{fr:[null,null,10,12,13,12],win:[9,13],roots:'第 4、2 弦'}};

/* ================= state ================= */
const DEF={key:0,tab:'scale',label:'deg',parent:false,scale:'major',chrom:false,hidden:[],sound:true,
  caged:{shape:'E',minor:false,ov:'scale'},chord:{type:'maj',v:0,all:true},

/* ================= theory helpers ================= */
const keyL=()=>KEYS[S.key][1];
const nameOfPc=pc=>(FLATPREF.has(S.key)||S.key===5?FLAT_N:SHARP_N)[pc];
function scaleNotes(sc,t=S.key,tL=KEYS[t][1]){return sc.d.map(l=>spell(t,tL,l))}
function ctxFor(t,tL,sc){const c={t,tL};if(sc&&sc.p&&sc.p!==1){c.pPc=mod(t-NAT[sc.p-1],12);c.pL=mod(tL-(sc.p-1),7)}return c}
function parentLbl(n,c){const k=mod(n.L-c.pL,7)+1;const a=mod(n.pc-(c.pPc+NAT[k-1])+6,12)-6;return({'-2':'bb','-1':'b','0':'','1':'#','2':'##'})[a]+k}
function labelOf(n,c){ // n: {pc,L?,name?,lbl}
  if(S.label==='name')return n.name||nameOfPc(n.pc);
  if(S.label==='int')return INT_NAME[mod(n.pc-c.t,12)];
  if(S.parent&&c.pPc!=null){return fmt(n.L!=null?parentLbl(n,c):CHROM[mod(n.pc-c.pPc,12)])}
  return fmt(n.lbl);
}
const colorOf=lbl=>`var(--d${degNum(lbl)})`;
function chordTones(rootPc,rootL,type){return sp(CH(type).f).map(l=>spell(rootPc,rootL,l))}
function chordName(rootName,type){return rootName+CH(type).sym}

function buildDiatonic(sc,t,tL,sev){
  const ns=scaleNotes(sc,t,tL);const out=[];
  const T3={'4-7':'maj','3-7':'m','3-6':'dim','4-8':'aug'},T4={'4-7-11':'maj7','4-7-10':'7','3-7-10':'m7','3-7-11':'mM7','3-6-10':'m7b5','3-6-9':'dim7','4-8-11':'augM7'};
  const RN=['I','II','III','IV','V','VI','VII'];
  const SUF={maj:'',m:'',dim:'°',aug:'+',maj7:'maj7','7':'7',m7:'7',mM7:'(maj7)',m7b5:'ø7',dim7:'°7',augM7:'+maj7'};
  const minorish=sc.id!=='major';
  const FN=minorish?['T','SD','T','SD','D','SD','D']:['T','SD','T','SD','D','T','D'];
  for(let i=0;i<7;i++){
    const r=ns[i],iv=[2,4,6].map(k=>mod(ns[(i+k)%7].pc-r.pc,12));
    const type=sev?T4[iv.join('-')]:T3[iv.slice(0,2).join('-')];
    const pd=parseDeg(r.lbl),acc=pd.acc<0?'♭':pd.acc>0?'♯':'';
    let rn=RN[i];if(['m','dim','m7','m7b5','dim7','mM7'].includes(type))rn=rn.toLowerCase();
    out.push({i,root:r,type,name:r.name+CH(type).sym,roman:acc+rn+SUF[type],num:acc+(i+1),sym:CH(type).sym,fn:FN[i]});
  }
  return out;
}
// voicings
function shapeAt(off,r){if(!off)return null;const fr=off.map(o=>o==null?null:o+r);const v=fr.filter(x=>x!=null);if(Math.min(...v)<0||Math.max(...v)>NF)return null;return fr}
function voicingsFor(rootPc,type){
  const c=CH(type),out=[];
  const op=OPEN[rootPc+'|'+type];if(op)out.push({g:'常用指型',lab:'開放和弦',fr:op});
  if(c.r6){const r=mod(rootPc-4,12);for(const rr of [r,r+12]){const fr=shapeAt(c.r6,rr);if(fr)out.push({g:'常用指型',lab:`6 弦根音・${rr} 品`,fr})}}
  if(c.r5){const r=mod(rootPc-9,12);for(const rr of [r,r+12]){const fr=shapeAt(c.r5,rr);if(fr)out.push({g:'常用指型',lab:`5 弦根音・${rr} 品`,fr})}}
  out.sort((a,b)=>(a.lab==='開放和弦'?-1:b.lab==='開放和弦'?1:avgF(a.fr)-avgF(b.fr)));
  const tones=chordTones(rootPc,0,type).map(n=>n.pc),n=tones.length;
  if(n<=4){
    const INV=['原位','第一轉位','第二轉位','第三轉位'];
    for(let s0=0;s0+n<=6;s0++){
      const sets=[];const fr=Array(6).fill(null);
      (function rec(k,used){
        if(k===n){const fv=fr.filter(x=>x!=null),pos=fv.filter(x=>x>0);const mx=Math.max(...fv),mn=pos.length?Math.min(...pos):0;
          if(fv.includes(0)?mx<=4:mx-mn<=(n===3?3:4))sets.push(fr.slice());return}
        const s=s0+k;for(let f=0;f<=NF;f++){const p=pcAt(s,f),idx=tones.indexOf(p);if(idx<0||used&(1<<idx))continue;
          const fv=fr.filter(x=>x!=null&&x>0);if(f>0&&fv.length&&(Math.max(...fv,f)-Math.min(...fv,f)>4))continue;
          fr[s]=f;rec(k+1,used|(1<<idx));fr[s]=null}
      })(0,0);
      sets.sort((a,b)=>avgF(a)-avgF(b));
      const strs=Array.from({length:n},(_,k)=>6-(s0+k)).join('-');
      for(const f of sets){const bass=tones.indexOf(pcAt(s0,f[s0]));out.push({g:`${n===3?'三和弦':'四音和弦'}轉位・弦組 ${strs}`,lab:`${INV[bass]}・${Math.min(...f.filter(x=>x!=null&&x>0).concat(f.includes(0)?[0]:[]))} 品`,fr:f})}
    }
  }
  return out;
}
const avgF=fr=>{const v=fr.filter(x=>x!=null);return v.reduce((a,b)=>a+b,0)/v.length};
function pickVoicing(rootPc,type,target,preferOpen){
  const vs=voicingsFor(rootPc,type);if(!vs.length)return null;
  if(preferOpen){const o=vs.find(v=>v.lab==='開放和弦');if(o)return o}
  const pool=vs.filter(v=>v.g==='常用指型'&&v.lab!=='開放和弦');const list=pool.length?pool:vs;
  return list.slice().sort((a,b)=>Math.abs(avgF(a.fr)-target)-Math.abs(avgF(b.fr)-target))[0];
}
function cagedInstances(letter,t,minor){
  const sh=CAGED[letter],third=mod(t+4,12),res=[];
  for(const off of [t-12,t,t+12]){
    const fr=sh.fr.map((f,s)=>{if(f==null)return null;let x=f+off;if(minor&&pcAt(s,x)===third)x-=1;return x});
    const v=fr.filter(x=>x!=null);if(Math.min(...v)<0||Math.max(...v)>NF)continue;
    res.push({letter,fr,win:[Math.max(0,sh.win[0]+off-(minor?1:0)),Math.min(NF,sh.win[1]+off)]});
  }
  return res;
}

/* ================= audio ================= */
let AC=null;const BUF={};
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function ksBuf(midi){if(BUF[midi])return BUF[midi];const a=ac();const sr=a.sampleRate,f=440*Math.pow(2,(midi-69)/12),N=Math.max(2,Math.round(sr/f)),len=Math.floor(sr*2.4);
  const b=a.createBuffer(1,len,sr),d=b.getChannelData(0);let prev=0;for(let i=0;i<N;i++){prev=0.55*(Math.random()*2-1)+0.45*prev;d[i]=prev}

  const marks=[],lines=[],kd=S.learn;let txt='';const map=new Map(ns.map(n=>[n.pc,n]));

    <p class="hint" style="text-align:center;margin-top:8px">五度圈：外圈是大調，內圈是關係小調。相鄰的調只差一個升降記號，亮起來的三個就是 I、IV、V。</p>`;

    ${sw('dOpen',S.dia.open,'優先用開放和弦','順階和和弦進行盡量用開放和弦按法')}${sw('dScale',S.dia.scale,'順階頁顯示音階音','和弦以外的音階音用淡色顯示')}${sw('sound',S.sound,'聲音','點指板和彈奏和弦時發出聲音')}

function openSheet(n){RT.sheet=n;sheetC.innerHTML=SHEETS[n]();sheetEl.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>sheetEl.classList.add('open')))}

const VIEWS={scale:viewScale,caged:viewCaged,chord:viewChord,dia:viewDia,quiz:viewQuiz,learn:viewLearn};
function renderHeader(){
  document.getElementById('keyK').textContent=keyTitle();
  document.getElementById('keyL').textContent=S.tab==='chord'?'根音':S.tab==='scale'||S.tab==='quiz'?SC(S.scale).zh:S.tab==='caged'?(S.caged.minor?'小調':'大調'):S.tab==='dia'?SC(S.dia.mode).zh:'調性';
  document.querySelectorAll('.nb').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===S.tab));
}
function update(){save();renderHeader();VIEWS[S.tab]();if(RT.sheet)sheetC.innerHTML=SHEETS[RT.sheet]()}
let toastT;function toast(h){const t=document.getElementById('toast');t.innerHTML=h;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function stopPlay(){if(RT.play){clearInterval(RT.play);RT.play=null;RT.playIdx=-1}}
function startPlay(){stopPlay();ac();const pcs=progChords();let beat=0;RT.playIdx=0;
  const step=()=>{const bar=Math.floor(beat/4),b=beat%4,i=bar%pcs.length;
    if(b===0){RT.playIdx=i;if(pcs[i].v)strum(pcs[i].v.fr,.38);VIEWS.dia()}else if(b===2&&pcs[i].v)strum(pcs[i].v.fr,.22);
    tick(b===0);beat++};
  step();RT.play=setInterval(step,60000/S.dia.bpm)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'sheet':openSheet(v);return;
    case 'closeSheet':closeSheet();return;
    case 'replayIntro':closeSheet();replayIntro();return;
    case 'setKey':S.key=+v;RT.q=null;RT.find=null;S.hidden=[];closeSheet();if(RT.play){update();startPlay();return}break;
    case 'pickScale':S.scale=v;S.hidden=[];RT.q=null;RT.find=null;closeSheet();break;
    case 'pickChord':S.chord.type=v;S.chord.v=0;closeSheet();break;
    case 'pickProg':S.dia.prog=v;closeSheet();if(RT.play){update();startPlay();return}break;
    case 'tab':if(S.tab!==v){stopPlay();S.tab=v;scrollTo(0,0)}break;
    case 'label':S.label=v;break;
    case 'hide':{const i=S.hidden.indexOf(v);i<0?S.hidden.push(v):S.hidden.splice(i,1);break}
    case 'cMinor':S.caged.minor=v==='1';break;
    case 'cShape':S.caged.shape=v;RT.scrollTo='caged';break;
    case 'cOv':S.caged.ov=v;break;
    case 'strumCaged':if(RT.cagedMemo)strum(RT.cagedMemo);return;
    case 'chStep':{const vs=voicingsFor(S.key,S.chord.type);S.chord.v=mod(S.chord.v+(+v),vs.length);RT.scrollTo='v';if(vs[S.chord.v])strum(vs[S.chord.v].fr);break}
    case 'strumV':{const vs=voicingsFor(S.key,S.chord.type);if(vs[S.chord.v])strum(vs[S.chord.v].fr)}return;
    case 'chAll':S.chord.all=v==='1';break;
    case 'dMode':S.dia.mode=v;break;
    case 'dSev':S.dia.sev=v==='1';break;
    case 'dSel':stopPlay();S.dia.sel=+v;update();if(RT.diaV)strum(RT.diaV.fr);return;
    case 'play':if(RT.play)stopPlay();else{startPlay();return}break;
    case 'bpm':S.dia.bpm=Math.max(48,Math.min(176,S.dia.bpm+(+v)));if(RT.play){save();startPlay();return}break;
    case 'qMode':S.quiz.mode=v;RT.q=null;RT.find=null;break;
    case 'qAns':S.quiz.ans=v;break;
    case 'qRange':S.quiz.range=+v;RT.q=null;RT.find=null;break;
    case 'ans':{const q=RT.q;if(!q||q.res)return;const ok=+v===q.n.pc;q.res=ok?'ok':'bad';q.pick=+v;RT.total++;if(ok){RT.score++;RT.streak++}else RT.streak=0;pluck(TUNING[q.s]+q.f);
      update();setTimeout(()=>{if(S.tab==='quiz'&&RT.q===q){newQ();update()}},ok?750:1500);return}
    case 'reveal':RT.find.reveal=true;break;
    case 'nextFind':newFind();break;
    case 'demo':S.learn=v;break;
    default:return;
  }
  update();
});

svg.addEventListener('click',e=>{
  const pnt=svg.createSVGPoint();pnt.x=e.clientX;pnt.y=e.clientY;const q=pnt.matrixTransform(svg.getScreenCTM().inverse());
  let u,v;if(G.vert){v=q.x-G.x0;u=q.y-G.headL}else{u=q.x-G.headL;v=G.padT+G.bw-q.y}
  if(v<-G.gap*.3||v>G.bw+G.gap*.3)return;const s=Math.max(0,Math.min(5,Math.floor(v/G.gap)));
  let f;if(u<0){if(u<-G.gap*1.2)return;f=0}else{f=G.pos.findIndex((p,i)=>i>0&&u<p);if(f<0)return}
  const p=pcAt(s,f),midi=TUNING[s]+f;pluck(midi);
  if(S.tab==='quiz'&&S.quiz.mode==='find'){const F=RT.find;if(F.done||f>S.quiz.range)return;
    if(p===F.n.pc){F.found.add(s+'-'+f);if(F.found.size>=F.total){F.done=true;RT.score++;RT.total++;RT.streak++}}
    else{F.wrong.push([s,f]);setTimeout(()=>{F.wrong.shift();RT.noanim=true;if(S.tab==='quiz')VIEWS.quiz()},900)}
    RT.noanim=true;VIEWS.quiz();return}
  if(S.tab==='quiz')return;
  toast(`第 ${6-s} 弦・${f===0?'空弦':'第 '+f+' 品'}　<b>${nameOfPc(p)}</b>　${keyTitle()} 調的 ${fmt(CHROM[mod(p-S.key,12)])} 級`);
  RT.flash={pc:p};RT.noanim=true;VIEWS[S.tab]();clearTimeout(RT.flT);RT.flT=setTimeout(()=>{RT.flash=null;RT.noanim=true;VIEWS[S.tab]()},1700);
});

let lastW=0;new ResizeObserver(()=>{const w=neckEl.clientWidth;if(Math.abs(w-lastW)<2)return;lastW=w;layout();RT.noanim=true;VIEWS[S.tab]()}).observe(neckEl);
drawGuitar();renderHeader();layout();update();
</script>
