<title>黑金指板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: sticky lacquer header (key + tabs) → control panel → full-length Les Paul Custom neck (vertical on phones, horizontal on wide screens) */
:root{
  color-scheme:dark;
  --ink:#0a0907;          /* black lacquer */
  --lacquer:#14120e;
  --raise:#1d1a14;
  --line:#2f2a20;
  --gold:#d4af37;
  --gold-hi:#f3d98c;
  --gold-lo:#8a6d1f;
  --text:#f0e8d6;
  --muted:#a59c86;
  --cream:#eadfc2;        /* binding */
  --ok:#5cc98a; --bad:#e2574c;
  --d1:#e8bf4a; --d2:#ef8f5e; --d3:#ec6b86; --d4:#b18aea; --d5:#5aaef0; --d6:#46c9ac; --d7:#a6d264;
  --f-display:"Bodoni Moda","Noto Serif TC",Georgia,serif;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lacquer)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(180deg,var(--lacquer),#100e0b);border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.45)}
header .wrap{padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-style:italic;font-weight:500;font-size:22px;letter-spacing:.02em;color:var(--gold-hi);line-height:1}
.brand h1 b{font-style:normal;font-family:var(--f-body);font-weight:900;font-size:13px;letter-spacing:.3em;color:var(--gold);margin-left:8px;vertical-align:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--ink);gap:2px}
.seg button{all:unset;cursor:pointer;padding:4px 11px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1a1306;font-weight:700}
.seg button:focus-visible,.chip:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.keys{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.keys::-webkit-scrollbar{display:none}
.key{all:unset;cursor:pointer;flex:0 0 auto;min-width:38px;text-align:center;padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-weight:700;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.key[aria-pressed="true"]{border-color:var(--gold);color:#1a1306;background:radial-gradient(circle at 50% 30%,var(--gold-hi),var(--gold) 70%)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr)}
.tab{all:unset;cursor:pointer;text-align:center;padding:9px 0 10px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tab[aria-selected="true"]{color:var(--gold-hi);border-bottom-color:var(--gold);font-weight:700}

main .wrap{padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;color:var(--gold-hi);text-wrap:balance}
.panel h2 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.panel h3{margin:4px 0 0;font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.panel p{margin:0;color:var(--muted);max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-size:14px;color:var(--text);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--gold);background:#2a2211;color:var(--gold-hi);font-weight:700}
.chip small{color:var(--muted);font-size:11px;margin-left:4px}
.btn{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1a1306;font-weight:700;font-size:14px}
.btn.ghost{background:transparent;color:var(--gold-hi);border:1px solid var(--gold-lo)}
select{font:inherit;color:var(--text);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
input[type=range]{accent-color:var(--gold)}
label.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
label.tog input{accent-color:var(--gold);width:16px;height:16px}
.degs{display:flex;flex-wrap:wrap;gap:6px}
.deg{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:44px;padding:5px 6px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.deg .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#140f05;font-weight:900;font-size:13px}
.deg .nm{font-size:12px;color:var(--text);margin-top:3px}
.deg[aria-pressed="false"]{opacity:.32}
.card{background:var(--lacquer);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dc{all:unset;cursor:pointer;text-align:center;padding:8px 2px;border-radius:10px;background:var(--raise);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.dc .rn{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--gold-hi)}
.dc .cn{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.dc .fn{font-size:10px;color:var(--muted);letter-spacing:.06em}
.dc[aria-pressed="true"]{border-color:var(--gold);background:#2a2211}
.dc.playing{box-shadow:0 0 0 2px var(--gold-hi)}
.seq{display:flex;flex-wrap:wrap;gap:6px}
.seq span{padding:4px 9px;border-radius:6px;background:var(--raise);border:1px solid var(--line);font-weight:700;font-size:13px}
.seq span.on{background:var(--gold);color:#1a1306;border-color:var(--gold)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:720px){.split{grid-template-columns:minmax(0,1fr)}.grid7{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cof{width:100%;max-width:240px;justify-self:center}
.stat{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:26px;color:var(--gold-hi);line-height:1}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.1em}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.answers .chip{text-align:center;font-weight:700;font-size:16px;padding:10px 0}
.answers .chip.ok{background:var(--ok);color:#06140c;border-color:var(--ok)}
.answers .chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.msg{font-weight:700;color:var(--gold-hi)}
.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.learn .card p,.learn .card li{color:var(--muted);font-size:14px}
.learn .card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.learn .card b{color:var(--text)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--gold);font-weight:700;font-size:12px}
.src a{color:var(--gold-hi)}
.src li{font-size:13px}

.neck{position:relative;min-width:0;border-radius:14px;background:radial-gradient(120% 60% at 50% 0%,#1a1711,var(--ink));padding-block:6px}
#neckSvg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#neckSvg text{font-family:var(--f-body);pointer-events:none}
.m{transform-box:fill-box;transform-origin:center;animation:pop .28s cubic-bezier(.2,1.4,.4,1) both}
.noanim .m{animation:none}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
.flash{animation:fl 1.6s ease-out forwards}
@keyframes fl{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.m,.pulse,.flash{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;background:rgba(20,18,14,.96);border:1px solid var(--gold-lo);color:var(--text);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center;transition:opacity .25s}
.toast b{color:var(--gold-hi)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Ebony Custom<b>黑金指板</b></h1>
      <div class="seg" role="group" aria-label="標示方式">
        <button data-act="label" data-v="deg">1 2 3</button>
        <button data-act="label" data-v="name">音名</button>
        <button data-act="label" data-v="int">音程</button>
      </div>
    </div>
    <div class="keys" id="keys" role="group" aria-label="調性 / 根音"></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-act="tab" data-v="scale">音階</button>
      <button class="tab" role="tab" data-act="tab" data-v="caged">CAGED</button>
      <button class="tab" role="tab" data-act="tab" data-v="chord">和弦</button>
      <button class="tab" role="tab" data-act="tab" data-v="dia">順階</button>
      <button class="tab" role="tab" data-act="tab" data-v="quiz">練習</button>
      <button class="tab" role="tab" data-act="tab" data-v="learn">樂理</button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="panel" id="panel"></section>
    <div class="neck" id="neck"><svg id="neckSvg" xmlns="http://www.w3.org/2000/svg"><g id="stat"></g><g id="dyn"></g></svg></div>
    <section class="panel" id="panel2"></section>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= music data ================= */
const LET='CDEFGAB', NAT=[0,2,4,5,7,9,11];
const KEYS=[['C',0],['D♭',1],['D',1],['E♭',2],['E',2],['F',3],['F♯',3],['G',4],['A♭',5],['A',5],['B♭',6],['B',6]];
const FLATPREF=new Set([1,3,5,8,10]);
const SHARP_N=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'], FLAT_N=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const TUNING=[40,45,50,55,59,64]; // string 6 → 1
const NF=22, INLAYS=[3,5,7,9,12,15,17,19,21];
const ACC={'-2':'𝄫','-1':'♭','0':'','1':'♯','2':'𝄪'};
const INT_NAME=['R','m2','M2','m3','M3','P4','TT','P5','m6','M6','m7','M7'];
const INT_ZH=['完全一度','小二度','大二度','小三度','大三度','完全四度','增四/減五','完全五度','小六度','大六度','小七度','大七度'];
const CHROM=['1','b2','2','b3','3','4','#4','5','b6','6','b7','7'];
const mod=(a,n)=>((a%n)+n)%n;
const fmt=l=>String(l).replace(/bb/g,'𝄫').replace(/b/g,'♭').replace(/##/g,'𝄪').replace(/#/g,'♯');
function parseDeg(l){const m=String(l).match(/^(bb|b|##|#)?(\d+)$/);const acc={bb:-2,b:-1,'#':1,'##':2}[m[1]]||0;const n=+m[2];return{n,acc,semi:NAT[(n-1)%7]+12*Math.floor((n-1)/7)+acc}}
const degNum=l=>((parseDeg(l).n-1)%7)+1;
function spell(rootPc,rootL,lbl){const d=parseDeg(lbl);const pc=mod(rootPc+d.semi,12);const L=mod(rootL+d.n-1,7);const a=mod(pc-NAT[L]+6,12)-6;return{pc,L,name:LET[L]+ACC[a],lbl}}
const pcAt=(s,f)=>mod(TUNING[s]+f,12);
const sp=s=>s.split(' ');

const SCALES=[
 {id:'major',g:'基本',zh:'大調音階',en:'Major · Ionian',d:sp('1 2 3 4 5 6 7'),p:1,desc:'最基本的音階，明亮又穩定。公式是「全全半全全全半」，所有樂理都從它推出來。'},
 {id:'minor',g:'基本',zh:'自然小調',en:'Natural Minor · Aeolian',d:sp('1 2 b3 4 5 b6 b7'),p:6,desc:'從大調的第 6 級開始彈，聽起來憂傷、抒情。和它的關係大調用的是同一組音（A 小調 = C 大調）。'},
 {id:'harm',g:'基本',zh:'和聲小調',en:'Harmonic Minor',d:sp('1 2 b3 4 5 b6 7'),p:6,desc:'把自然小調的第 7 音升高半音，產生強烈的導音和屬和弦，帶古典或異國色彩。'},
 {id:'mel',g:'基本',zh:'旋律小調',en:'Melodic Minor',d:sp('1 2 b3 4 5 6 7'),p:6,desc:'自然小調升高 6、7 音（爵士用上行形式），是爵士和 Fusion 常用的小調色彩。'},
 {id:'majp',g:'五聲與藍調',zh:'大調五聲',en:'Major Pentatonic',d:sp('1 2 3 5 6'),p:1,desc:'拿掉大調的 4 和 7，沒有半音，怎麼彈都好聽。鄉村、流行、抒情 solo 都很常用。'},
 {id:'minp',g:'五聲與藍調',zh:'小調五聲',en:'Minor Pentatonic',d:sp('1 b3 4 5 b7'),p:6,desc:'搖滾和藍調 solo 第一個要學的音階，五個指型剛好對應 CAGED。'},
 {id:'blues',g:'五聲與藍調',zh:'藍調音階',en:'Blues',d:sp('1 b3 4 b5 5 b7'),p:6,desc:'在小調五聲加上 ♭5（藍調音），經過它就有濃濃的藍調味。'},
 {id:'majb',g:'五聲與藍調',zh:'大調藍調',en:'Major Blues',d:sp('1 2 b3 3 5 6'),p:1,desc:'在大調五聲加上 ♭3，從 ♭3 推弦或滑到 3，是鄉村藍調的甜味。'},
 {id:'dor',g:'調式 Modes',zh:'多利安',en:'Dorian',d:sp('1 2 b3 4 5 6 b7'),p:2,desc:'小調，但第 6 音是大六度，比自然小調亮。Funk、Santana、爵士小調常用。特色音是 6。'},
 {id:'phr',g:'調式 Modes',zh:'弗里吉亞',en:'Phrygian',d:sp('1 b2 b3 4 5 b6 b7'),p:3,desc:'小調加上 ♭2，帶西班牙或金屬的暗黑感。特色音是 ♭2。'},
 {id:'lyd',g:'調式 Modes',zh:'利地安',en:'Lydian',d:sp('1 2 3 #4 5 6 7'),p:4,desc:'大調升高第 4 音，聽起來夢幻、漂浮，電影配樂很愛用。特色音是 ♯4。'},
 {id:'mix',g:'調式 Modes',zh:'米索利地安',en:'Mixolydian',d:sp('1 2 3 4 5 6 b7'),p:5,desc:'大調降低第 7 音，就是搖滾和藍調的大調聲音，屬七和弦上首選。特色音是 ♭7。'},
 {id:'loc',g:'調式 Modes',zh:'洛克利安',en:'Locrian',d:sp('1 b2 b3 4 b5 b6 b7'),p:7,desc:'最不穩定的調式，適合配半減七和弦（m7♭5）。特色音是 ♭5。'},
 {id:'phd',g:'調式 Modes',zh:'弗里吉亞屬音',en:'Phrygian Dominant',d:sp('1 b2 3 4 5 b6 b7'),p:3,desc:'和聲小調的第 5 調式，有佛朗明哥、中東和金屬的味道，常用在小調的 V7 上。'},
];
const SC=id=>SCALES.find(s=>s.id===id);

// chord types. r6/r5 = movable shapes (fret offsets from root fret, string 6→1, null = mute)
const CHORDS=[
 {id:'maj',sym:'',zh:'大三和弦',f:'1 3 5',r6:[0,2,2,1,0,0],r5:[null,0,2,2,2,0]},
 {id:'m',sym:'m',zh:'小三和弦',f:'1 b3 5',r6:[0,2,2,0,0,0],r5:[null,0,2,2,1,0]},
 {id:'dim',sym:'dim',zh:'減三和弦',f:'1 b3 b5',r6:[0,1,2,0,null,null],r5:[null,0,1,2,1,null]},
 {id:'aug',sym:'aug',zh:'增三和弦',f:'1 3 #5',r6:[0,null,2,1,1,null],r5:[null,0,3,2,2,null]},
 {id:'sus2',sym:'sus2',zh:'掛二和弦',f:'1 2 5',r6:null,r5:[null,0,2,2,0,0]},
 {id:'sus4',sym:'sus4',zh:'掛四和弦',f:'1 4 5',r6:[0,2,2,2,0,0],r5:[null,0,2,2,3,0]},
 {id:'6',sym:'6',zh:'大六和弦',f:'1 3 5 6',r6:[0,null,-1,1,0,null],r5:[null,0,2,2,2,2]},
 {id:'m6',sym:'m6',zh:'小六和弦',f:'1 b3 5 6',r6:[0,null,-1,0,0,null],r5:[null,0,null,-1,1,0]},
 {id:'7',sym:'7',zh:'屬七和弦',f:'1 3 5 b7',r6:[0,2,0,1,0,0],r5:[null,0,2,0,2,0]},
 {id:'maj7',sym:'maj7',zh:'大七和弦',f:'1 3 5 7',r6:[0,null,1,1,0,null],r5:[null,0,2,1,2,0]},
 {id:'m7',sym:'m7',zh:'小七和弦',f:'1 b3 5 b7',r6:[0,2,0,0,0,0],r5:[null,0,2,0,1,0]},
 {id:'m7b5',sym:'m7♭5',zh:'半減七和弦',f:'1 b3 b5 b7',r6:[0,null,0,0,-1,null],r5:[null,0,1,0,1,null]},
 {id:'dim7',sym:'dim7',zh:'減七和弦',f:'1 b3 b5 bb7',r6:[0,null,-1,0,-1,null],r5:[null,0,1,-1,1,null]},
 {id:'mM7',sym:'m(maj7)',zh:'小大七和弦',f:'1 b3 5 7',r6:[0,2,1,0,0,0],r5:[null,0,2,1,1,0]},
 {id:'augM7',sym:'+maj7',zh:'增大七和弦',f:'1 3 #5 7',r6:[0,null,1,1,1,null],r5:[null,0,null,1,2,1]},
 {id:'7sus4',sym:'7sus4',zh:'屬七掛四',f:'1 4 5 b7',r6:[0,2,0,2,0,0],r5:[null,0,2,0,3,0]},
 {id:'add9',sym:'add9',zh:'加九和弦',f:'1 3 5 9',r6:null,r5:[null,0,2,4,2,0]},

  const minorish=sc.id!=='major';

  for(let i=0;i<7;i++){
    const r=ns[i],iv=[2,4,6].map(k=>mod(ns[(i+k)%7].pc-r.pc,12));

function shapeAt(off,r){if(!off)return null;const fr=off.map(o=>o==null?null:o+r);const v=fr.filter(x=>x!=null);if(Math.min(...v)<0||Math.max(...v)>NF)return null;return fr}
function voicingsFor(rootPc,type){
  const c=CH(type),out=[];
  const op=OPEN[rootPc+'|'+type];if(op)out.push({g:'常用指型',lab:'開放和弦',fr:op});
  if(c.r6){const r=mod(rootPc-4,12);for(const rr of [r,r+12]){const fr=shapeAt(c.r6,rr);if(fr)out.push({g:'常用指型',lab:`6 弦根音・${rr} 品`,fr})}}
  if(c.r5){const r=mod(rootPc-9,12);for(const rr of [r,r+12]){const fr=shapeAt(c.r5,rr);if(fr)out.push({g:'常用指型',lab:`5 弦根音・${rr} 品`,fr})}}
  out.sort((a,b)=>(a.lab==='開放和弦'?-1:b.lab==='開放和弦'?1:avgF(a.fr)-avgF(b.fr)));
  const tones=chordTones(rootPc,0,type).map(n=>n.pc),n=tones.length;
  if(n<=4){
    const INV=['原位','第一轉位','第二轉位','第三轉位'];
    for(let s0=0;s0+n<=6;s0++){
      const sets=[];const fr=Array(6).fill(null);
      (function rec(k,used){
        if(k===n){const fv=fr.filter(x=>x!=null),pos=fv.filter(x=>x>0);const mx=Math.max(...fv),mn=pos.length?Math.min(...pos):0;
          if(fv.includes(0)?mx<=4:mx-mn<=(n===3?3:4))sets.push(fr.slice());return}
        const s=s0+k;for(let f=0;f<=NF;f++){const p=pcAt(s,f),idx=tones.indexOf(p);if(idx<0||used&(1<<idx))continue;
          const fv=fr.filter(x=>x!=null&&x>0);if(f>0&&fv.length&&(Math.max(...fv,f)-Math.min(...fv,f)>4))continue;
          fr[s]=f;rec(k+1,used|(1<<idx));fr[s]=null}
      })(0,0);
      sets.sort((a,b)=>avgF(a)-avgF(b));
      const strs=Array.from({length:n},(_,k)=>6-(s0+k)).join('-');
      for(const f of sets){const bass=tones.indexOf(pcAt(s0,f[s0]));out.push({g:`${n===3?'三和弦':'四音和弦'}轉位・弦組 ${strs}`,lab:`${INV[bass]}・${Math.min(...f.filter(x=>x!=null&&x>0).concat(f.includes(0)?[0]:[]))} 品`,fr:f})}
    }
  }
  return out;
}
const avgF=fr=>{const v=fr.filter(x=>x!=null);return v.reduce((a,b)=>a+b,0)/v.length};
function pickVoicing(rootPc,type,target,preferOpen){
  const vs=voicingsFor(rootPc,type);if(!vs.length)return null;
  if(preferOpen){const o=vs.find(v=>v.lab==='開放和弦');if(o)return o}
  const pool=vs.filter(v=>v.g==='常用指型'&&v.lab!=='開放和弦');const list=pool.length?pool:vs;
  return list.slice().sort((a,b)=>Math.abs(avgF(a.fr)-target)-Math.abs(avgF(b.fr)-target))[0];
}
function cagedInstances(letter,t,minor){
  const sh=CAGED[letter],third=mod(t+4,12),res=[];
  for(const off of [t-12,t,t+12]){
    const fr=sh.fr.map((f,s)=>{if(f==null)return null;let x=f+off;if(minor&&pcAt(s,x)===third)x-=1;return x});
    const v=fr.filter(x=>x!=null);if(Math.min(...v)<0||Math.max(...v)>NF)continue;
    res.push({letter,fr,win:[Math.max(0,sh.win[0]+off-(minor?1:0)),Math.min(NF,sh.win[1]+off)]});
  }
  return res;
}

   <linearGradient id="gloss" ${gx}><stop offset="0" stop-color="#050505"/><stop offset=".45" stop-color="#1f1f1f"/><stop offset=".55" stop-color="#0d0d0d"/><stop offset="1" stop-color="#030303"/></linearGradient>

function renderMarks(marks,extra={}){
  let s='';const k=RT.noanim;RT.noanim=false;gDyn.classList.toggle('noanim',k);
  // zones (brackets)
  if(extra.zones){extra.zones.forEach(z=>{const lane=z.lane||0;const v=G.bw+(G.vert?10:12)+lane*13;
    const u0=z.win[0]===0?along(0)-rad(0):G.pos[z.win[0]-1]+2,u1=G.pos[z.win[1]]-2;const[a,b]=pt(u0,v),[c,d]=pt(u1,v),[mx,my]=pt((u0+u1)/2,v);
    s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${z.col}" stroke-width="3" stroke-linecap="round" opacity=".9"/><circle cx="${mx}" cy="${my}" r="7.5" fill="${z.col}"/><text x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="900" fill="#140f05">${z.letter}</text>`})}
  // lines
  (extra.lines||[]).forEach(L=>{const pts=L.pts.map(([s0,f])=>P(along(f),across(s0))).join(' ');s+=`<polyline points="${pts}" fill="none" stroke="${L.col||'var(--gold-hi)'}" stroke-width="${L.w||4}" stroke-opacity="${L.op||.5}" stroke-linecap="round" stroke-linejoin="round" ${L.dash?'stroke-dasharray="5 5"':''}/>`});
  // muted strings for voicing
  (extra.mutes||[]).forEach(s0=>{const[x,y]=pt(along(0),across(s0));const r=G.gap*.18;s+=`<path d="M${x-r},${y-r}L${x+r},${y+r}M${x+r},${y-r}L${x-r},${y+r}" stroke="var(--bad)" stroke-width="2.5" stroke-linecap="round"/>`});
  for(const m of marks){
    const [x,y]=pt(along(m.f),across(m.s));let r=rad(m.f);if(m.kind==='ghost')r*=.6;if(m.small)r*=.8;
    const t=m.text??'',fs=(t.length>=3?.62:t.length===2?.8:.95)*r;
    let c='';
    if(m.kind==='main'){c=`<circle cx="${x}" cy="${y}" r="${r}" fill="${m.root?'url(#rootG)':m.col}" stroke="#0a0806" stroke-width="1.5"/><text x="${x}" y="${y+.5}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="900" fill="#140f05">${t}</text>`}
    else if(m.kind==='dim'){c=`<circle cx="${x}" cy="${y}" r="${r*.86}" fill="${m.col}" fill-opacity=".16" stroke="${m.col}" stroke-opacity=".75" stroke-width="1.5"/><text x="${x}" y="${y+.5}" text-anchor="middle" dominant-baseline="central" font-size="${fs*.9}" font-weight="700" fill="${m.col}">${t}</text>`}
    else if(m.kind==='ghost'){c=`<circle cx="${x}" cy="${y}" r="${r}" fill="#26211a" stroke="#4a4335"/><text x="${x}" y="${y+.5}" text-anchor="middle" dominant-baseline="central" font-size="${Math.max(8,fs*.95)}" fill="#958b76">${t}</text>`}
    else if(m.kind==='q'){c=`<g class="pulse"><circle cx="${x}" cy="${y}" r="${r}" fill="#2a2211" stroke="var(--gold-hi)" stroke-width="3"/><text x="${x}" y="${y+.5}" text-anchor="middle" dominant-baseline="central" font-size="${r}" font-weight="900" fill="var(--gold-hi)">?</text></g>`}
    else if(m.kind==='bad'){c=`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--bad)" class="flash"/>`}
    if(m.ring)c+=`<circle cx="${x}" cy="${y}" r="${r+3.5}" fill="none" stroke="${m.ringCol||'var(--gold-hi)'}" stroke-width="2.2"/>`;
    s+=`<g class="m">${c}</g>`;
  }
  if(RT.flash){for(let s0=0;s0<6;s0++)for(let f=0;f<=NF;f++)if(pcAt(s0,f)===RT.flash.pc){const[x,y]=pt(along(f),across(s0));s+=`<circle class="flash" cx="${x}" cy="${y}" r="${rad(f)+5}" fill="none" stroke="var(--gold-hi)" stroke-width="2" stroke-dasharray="4 3"/>`}}
  gDyn.innerHTML=s;
  if(RT.scrollTo!=null&&G.vert){const f=RT.scrollTo;RT.scrollTo=null;const y=G.headL+along(f);const rect=svg.getBoundingClientRect();const abs=rect.top+scrollY+y*(rect.height/G.H);
    const vis=abs>scrollY+140&&abs<scrollY+innerHeight-80;if(!vis)scrollTo({top:abs-innerHeight*.45,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
}
function* positions(maxF=NF){for(let s=0;s<6;s++)for(let f=0;f<=maxF;f++)yield[s,f]}

  ${sc.p!==1?`<label class="tog"><input type="checkbox" id="tParent" data-tog="parent" ${S.parent?'checked':''}>首調簡譜（以關係大調為 1）</label>`:''}</div>
  <p style="font-size:12px">點上方的級數可以隱藏或顯示該音，例如只留 1・3・5 看和弦骨架。點指板上任何一個音會發出聲音，並標出指板上所有同名的音。</p>`;
  panel2.innerHTML='';

    else if(S.chrom){const lbl=CHROM[mod(p-S.key,12)];marks.push({s,f,kind:'ghost',text:S.label==='name'?nameOfPc(p):S.label==='int'?INT_NAME[mod(p-S.key,12)]:fmt(lbl)})}}

}

function viewCaged(){
  const C=S.caged,minor=C.minor,t=S.key,tL=keyL();
  const sc=SC(minor?'minor':'major'),ns=scaleNotes(sc),pent=scaleNotes(SC(minor?'minp':'majp'));const c=ctxFor(t,tL,sc);
  const chordT=chordTones(t,tL,minor?'m':'maj'),rootName=ns[0].name;
  const map=new Map(ns.map(n=>[n.pc,n])),pmap=new Map(pent.map(n=>[n.pc,n])),cpc=new Map(chordT.map(n=>[n.pc,n]));
  const marks=[],zones=[],lines=[];let info='';
  const ovMap=C.ov==='pent'?pmap:map;
  if(C.shape==='all'){
    let all=[];CORDER.forEach(L=>cagedInstances(L,t,minor).forEach(i=>all.push(i)));all.sort((a,b)=>a.win[0]-b.win[0]);
    all.forEach((z,i)=>zones.push({win:z.win,letter:z.letter,col:CCOL[z.letter],lane:i%2}));
    for(const[s,f]of positions()){const p=pcAt(s,f);if(cpc.has(p)){const n=cpc.get(p);marks.push({s,f,kind:'main',col:colorOf(n.lbl),root:n.lbl==='1',text:labelOf(n,c)})}
      else if(C.ov!=='none'&&ovMap.has(p)){const n=ovMap.get(p);marks.push({s,f,kind:'dim',col:colorOf(n.lbl),text:labelOf(n,c)})}}
    info=`<p>五個指型像拼圖一樣，從低把位到高把位依序是 <b style="color:var(--text)">${all.map(z=>z.letter).join(' → ')}</b>，然後循環。相鄰的兩個指型會共用根音，指板旁的彩色括號標出每個指型的範圍。</p>`;
  }else{
    const insts=cagedInstances(C.shape,t,minor),inst=insts[0];
    const z=inst;zones.push({win:z.win,letter:z.letter,col:CCOL[z.letter]});
    insts.slice(1).forEach(o=>zones.push({win:o.win,letter:o.letter,col:CCOL[o.letter],lane:1}));
    const inShape=new Set();inst.fr.forEach((f,s)=>{if(f!=null)inShape.add(s+'-'+f)});
    for(const[s,f]of positions()){const p=pcAt(s,f),key=s+'-'+f;const inWin=f>=z.win[0]&&f<=z.win[1];
      if(inShape.has(key)){const n=cpc.get(p);marks.push({s,f,kind:'main',col:colorOf(n.lbl),root:n.lbl==='1',ring:true,text:labelOf(n,c)})}
      else if(inWin&&C.ov!=='none'&&ovMap.has(p)){const n=ovMap.get(p);marks.push({s,f,kind:cpc.has(p)?'main':'dim',col:colorOf(n.lbl),root:n.lbl==='1',text:labelOf(n,c)})}
      else if(cpc.has(p)&&C.ov!=='none'){const n=cpc.get(p);marks.push({s,f,kind:'ghost',text:labelOf(n,c)})}}
    const pts=[];inst.fr.forEach((f,s)=>{if(f!=null)pts.push([s,f])});lines.push({pts,col:CCOL[C.shape],op:.55});
    const i=CORDER.indexOf(C.shape),lo=Math.min(...inst.fr.filter(x=>x!=null));
    info=`<p><b style="color:var(--text)">${rootName}${minor?'m':''} 的 ${C.shape} 指型・從第 ${lo} 品開始</b>。根音在${CAGED[C.shape].roots}。往高把位接 <b style="color:${CCOL[CORDER[(i+1)%5]]}">${CORDER[(i+1)%5]} 指型</b>，往低把位接 <b style="color:${CCOL[CORDER[(i+4)%5]]}">${CORDER[(i+4)%5]} 指型</b>。有金色外圈的是和弦按法，其餘是同一把位的${C.ov==='pent'?'五聲':minor?'小調':'大調'}音階。</p>
    <div class="row"><button class="btn ghost" data-act="strumCaged">▶ 彈這個和弦</button></div>`;
    RT.cagedMemo=inst.fr;
    if(RT.scrollTo==='caged')RT.scrollTo=Math.round((z.win[0]+z.win[1])/2);
  }
  panel.innerHTML=`<div class="row"><div class="seg"><button data-act="cMinor" data-v="0" ${pressed(!minor)}>大調 / 大三和弦</button><button data-act="cMinor" data-v="1" ${pressed(minor)}>小調 / 小三和弦</button></div></div>
  <div class="row">${CORDER.map(L=>`<button class="chip" data-act="cShape" data-v="${L}" ${pressed(C.shape===L)} style="${C.shape===L?`border-color:${CCOL[L]};color:${CCOL[L]}`:''}"><b>${L}</b><small>指型</small></button>`).join('')}<button class="chip" data-act="cShape" data-v="all" ${pressed(C.shape==='all')}>全部五個</button></div>
  <div class="row"><span style="font-size:13px;color:var(--muted)">疊加</span><div class="seg"><button data-act="cOv" data-v="none" ${pressed(C.ov==='none')}>只看和弦</button><button data-act="cOv" data-v="scale" ${pressed(C.ov==='scale')}>${minor?'小調':'大調'}音階</button><button data-act="cOv" data-v="pent" ${pressed(C.ov==='pent')}>五聲音階</button></div></div>
  <h2>${rootName}${minor?'m':''} · CAGED<small>${C.shape==='all'?'整個指板':C.shape+' Shape'}</small></h2>${info}`;
  panel2.innerHTML=`<div class="card"><h3>CAGED 是什麼</h3><p>C、A、G、E、D 是五個開放和弦。把它們做成可以移動的封閉和弦，就能在指板上任何地方彈出同一個和弦。按 C→A→G→E→D 的順序接起來，就會把整個指板分成五個區塊。每個和弦指型周圍都有一組對應的音階指型（大調音階或五聲音階），所以 <b style="color:var(--text)">和弦、音階、琶音三者用同一張地圖</b>。小調只要把大三度降半音（3 → ♭3）就是小和弦指型。</p></div>`;
  renderMarks(marks,{zones,lines});
}

function viewChord(){
  const t=S.key,tL=keyL(),type=S.chord.type,ch=CH(type),tones=chordTones(t,tL,type),c={t,tL};
  const vs=voicingsFor(t,type);if(S.chord.v>=vs.length)S.chord.v=0;const v=vs[S.chord.v];
  const stack=tones.slice(1).map((n,i)=>INT_ZH[mod(n.pc-tones[i].pc,12)]).join(' + ');
  const groups=[...new Set(vs.map(x=>x.g))];
  panel.innerHTML=`<div class="row">${CHORDS.map(x=>`<button class="chip" data-act="chType" data-v="${x.id}" ${pressed(x.id===type)}>${keyTitle()}${x.sym||''}${x.sym?'':'<small>maj</small>'}</button>`).join('')}</div>
  <h2>${tones[0].name}${ch.sym}<small>${ch.zh}</small></h2>
  <div class="degs">${tones.map(n=>`<div class="deg" style="--c:${colorOf(n.lbl)}"><span class="n">${fmt(n.lbl)}</span><span class="nm">${n.name}</span></div>`).join('')}</div>
  <p>公式 <b style="color:var(--text)">${fmt(ch.f)}</b>，從根音往上疊：${stack}。${tones.length>4?'九和弦通常省略 5 音，所以只列出常用指型。':''}</p>
  <div class="row"><label class="tog"><input type="checkbox" id="tAll" data-tog="chAll" ${S.chord.all?'checked':''}>同時顯示指板上所有和弦音</label><button class="btn ghost" data-act="strumV">▶ 彈奏</button></div>`;
  panel2.innerHTML=`<div class="card"><h3>按法與轉位（${vs.length} 種）</h3>${groups.map(g=>`<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;color:var(--muted)">${g}</span><div class="row">${vs.map((x,i)=>x.g===g?`<button class="chip" data-act="chV" data-v="${i}" ${pressed(i===S.chord.v)}>${x.lab}</button>`:'').join('')}</div></div>`).join('')}
  <p style="font-size:12px">三和弦轉位：同一個和弦換成 3 音或 5 音在最低，聲音更輕巧，是伴奏和第二把吉他的好用技巧。四條相鄰弦組合可以把整個指板連起來。</p></div>`;
  const map=new Map(tones.map(n=>[n.pc,n])),marks=[],inV=new Set(),pts=[],mutes=[];
  if(v){v.fr.forEach((f,s)=>{if(f==null)mutes.push(s);else{inV.add(s+'-'+f);pts.push([s,f])}})}
  for(const[s,f]of positions()){const p=pcAt(s,f),n=map.get(p);if(!n)continue;const isV=inV.has(s+'-'+f);
    if(isV)marks.push({s,f,kind:'main',col:colorOf(n.lbl),root:n.lbl==='1',ring:true,text:labelOf(n,c)});
    else if(S.chord.all)marks.push({s,f,kind:'dim',col:colorOf(n.lbl),text:labelOf(n,c)});}
  if(v&&RT.scrollTo==='v')RT.scrollTo=Math.round(avgF(v.fr));
  renderMarks(marks,{lines:pts.length?[{pts}]:[],mutes});
}

function curDia(){
  const sc=SC(S.dia.mode);return buildDiatonic(sc,S.key,keyL(),S.dia.sev);
}
function progChords(){
  const p=PROGS.find(x=>x.id===S.dia.prog),maj=SC('major');const dia=buildDiatonic(maj,S.key,keyL(),!!p.sev);
  let prev=null;return p.seq.map(d=>{let ch=dia[d-1];if(p.dom)ch={...ch,type:'7',name:ch.root.name+'7',roman:['I','II','III','IV','V','VI','VII'][d-1]+'7',sym:'7'};
    const v=pickVoicing(ch.root.pc,ch.type,prev??4,S.dia.open);prev=v?avgF(v.fr):prev;return{...ch,v,deg:d}});
}

  RT.diaV=v;

  <h2>${ns[0].name} ${sc.zh} 順階和弦<small>Diatonic Chords</small></h2>

   <div class="row"><label class="tog"><input type="checkbox" id="tOpen" data-tog="dOpen" ${S.dia.open?'checked':''}>優先用開放和弦</label><label class="tog"><input type="checkbox" id="tScale" data-tog="dScale" ${S.dia.scale?'checked':''}>顯示其他音階音</label></div>

  <div class="card"><h3>4・大調音階與調號</h3><ul><li>公式是 <b>全 全 半 全 全 全 半</b>，也就是 1 2 3 4 5 6 7，在 3–4 和 7–1 之間是半音。</li>

   <li>再疊一個三度就是七和弦：maj7（1 3 5 7）、7（1 3 5 ♭7）、m7（1 ♭3 5 ♭7）、m7♭5（1 ♭3 ♭5 ♭7）、dim7（1 ♭3 ♭5 𝄫7）。</li>

   <li>常見進行：1-6-4-5、1-5-6-4、卡農 1-5-6-3-4-1-4-5、4-5-3-6-2-5-1、爵士 2-5-1。</li></ul></div>

  <div class="card"><h3>9・建議學習路線</h3><ul>

  switch(a){
    case 'key':S.key=+v;RT.q=null;RT.find=null;if(S.tab==='scale')S.hidden=[];if(RT.play){update();startPlay();return}break;
    case 'tab':if(S.tab!==v)stopPlay();S.tab=v;break;
    case 'label':S.label=v;break;
    case 'hide':{const i=S.hidden.indexOf(v);i<0?S.hidden.push(v):S.hidden.splice(i,1);break}
    case 'cMinor':S.caged.minor=v==='1';break;
    case 'cShape':S.caged.shape=v;RT.scrollTo='caged';break;
    case 'cOv':S.caged.ov=v;break;
    case 'strumCaged':if(RT.cagedMemo)strum(RT.cagedMemo);return;
    case 'chType':S.chord.type=v;S.chord.v=0;break;
    case 'chV':S.chord.v=+v;RT.scrollTo='v';{const vs=voicingsFor(S.key,S.chord.type);if(vs[+v])strum(vs[+v].fr)}break;
    case 'strumV':{const vs=voicingsFor(S.key,S.chord.type);if(vs[S.chord.v])strum(vs[S.chord.v].fr)}return;
    case 'dMode':S.dia.mode=v;break;
    case 'dSev':S.dia.sev=v==='1';break;
    case 'dSel':stopPlay();S.dia.sel=+v;update();if(RT.diaV)strum(RT.diaV.fr);return;
    case 'prog':S.dia.prog=v;if(RT.play){update();startPlay();return}break;
    case 'play':if(RT.play){stopPlay()}else{startPlay();return}break;
    case 'qMode':S.quiz.mode=v;RT.q=null;RT.find=null;break;
    case 'qAns':S.quiz.ans=v;break;
    case 'qRange':S.quiz.range=+v;RT.q=null;RT.find=null;break;
    case 'ans':{const q=RT.q;if(!q||q.res)return;const ok=+v===q.n.pc;q.res=ok?'ok':'bad';q.pick=+v;RT.total++;if(ok){RT.score++;RT.streak++}else RT.streak=0;pluck(TUNING[q.s]+q.f);
      update();setTimeout(()=>{if(S.tab==='quiz'&&RT.q===q){newQ();update()}},ok?750:1500);return}
    case 'reveal':RT.find.reveal=true;break;
    case 'nextFind':newFind();break;
    case 'demo':S.learn=v;break;
    default:return;
  }
  update();
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.change==='scale'){S.scale=el.value;S.hidden=[];RT.q=null;RT.find=null;update()}
  const tg=el.dataset.tog;if(tg){const m={chrom:['',"chrom"],parent:['','parent'],chAll:['chord','all'],dOpen:['dia','open'],dScale:['dia','scale']}[tg];if(m[0])S[m[0]][m[1]]=el.checked;else S[m[1]]=el.checked;if(tg==='dOpen'&&RT.play){update();startPlay();return}update()}
});
document.addEventListener('input',e=>{if(e.target.dataset.input==='bpm'){S.dia.bpm=+e.target.value;document.getElementById('bpmV').textContent=S.dia.bpm;save();if(RT.play){clearInterval(RT.play);const cur=RT.playIdx;startPlay()}}});

svg.addEventListener('click',e=>{
  const pnt=svg.createSVGPoint();pnt.x=e.clientX;pnt.y=e.clientY;const q=pnt.matrixTransform(svg.getScreenCTM().inverse());
  let u,v;if(G.vert){v=q.x-G.x0;u=q.y-G.headL}else{u=q.x-G.headL;v=G.padT+G.bw-q.y}
  if(v<-G.gap*.3||v>G.bw+G.gap*.3)return;const s=Math.max(0,Math.min(5,Math.floor(v/G.gap)));
  let f;if(u<0){if(u<-G.gap*1.2)return;f=0}else{f=G.pos.findIndex((p,i)=>i>0&&u<p);if(f<0)return}
  const p=pcAt(s,f),midi=TUNING[s]+f;pluck(midi);
  if(S.tab==='quiz'&&S.quiz.mode==='find'){const F=RT.find;if(F.done||f>S.quiz.range)return;
    if(p===F.n.pc){F.found.add(s+'-'+f);if(F.found.size>=F.total){F.done=true;RT.score++;RT.total++;RT.streak++}}
    else{F.wrong.push([s,f]);setTimeout(()=>{F.wrong.shift();RT.noanim=true;if(S.tab==='quiz')VIEWS.quiz()},900)}
    RT.noanim=true;VIEWS.quiz();return}
  if(S.tab==='quiz')return;
  const nm=nameOfPc(p),deg=fmt(CHROM[mod(p-S.key,12)]);
  toast(`第 ${6-s} 弦・${f===0?'空弦':'第 '+f+' 品'}　<b>${nm}</b>　${keyTitle()} 調 ${deg} 級・${INT_NAME[mod(p-S.key,12)]}　<span style="color:var(--muted)">八度 ${Math.floor(midi/12)-1}</span>`);
  RT.flash={pc:p};RT.noanim=true;VIEWS[S.tab]();clearTimeout(RT.flT);RT.flT=setTimeout(()=>{RT.flash=null;RT.noanim=true;VIEWS[S.tab]()},1700);
});

let lastW=0;new ResizeObserver(()=>{const w=neckEl.clientWidth;if(Math.abs(w-lastW)<2)return;lastW=w;layout();RT.noanim=true;VIEWS[S.tab]()}).observe(neckEl);
renderHeader();layout();update();
</script>
